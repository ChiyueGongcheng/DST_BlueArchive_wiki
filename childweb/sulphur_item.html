    <script>
        // 物品总览：数据来自 ./sulphur_data/item.json，由页面自动生成
        document.addEventListener('DOMContentLoaded', function () {
            var searchInput = document.getElementById('searchInput');
            var categoryButtons = document.querySelectorAll('.category-btn');
            var grid = document.getElementById('iconGrid');
            var activeCategory = 'all';

            function renderIcons(list) {
                if (!grid) return;
                grid.innerHTML = '';
                if (!list.length) {
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h3>未找到匹配的物品</h3><p>请尝试其他搜索词或选择其他分类</p></div>';
                    return;
                }
                list.forEach(function (item) {
                    var card = document.createElement('a');
                    card.href = item.link;
                    card.className = 'card';
                    card.innerHTML = '<div class="icon-container"><img src="' + item.imageUrl + '" alt="' + item.name + '" class="icon-img"></div>';
                    grid.appendChild(card);
                });
            }

            function applyFilters() {
                var list = icons;
                if (activeCategory !== 'all') {
                    list = list.filter(function (item) {
                        return item.category.toLowerCase() === activeCategory.toLowerCase() ||
                            item.tags.some(function (tag) { return tag.toLowerCase() === activeCategory.toLowerCase(); });
                    });
                }
                var term = (searchInput.value || '').trim().toLowerCase();
                if (term) {
                    list = list.filter(function (item) {
                        return item.name.toLowerCase().indexOf(term) >= 0 ||
                            item.category.toLowerCase().indexOf(term) >= 0 ||
                            item.tags.some(function (tag) { return tag.toLowerCase().indexOf(term) >= 0; });
                    });
                }
                renderIcons(list);
            }

            var icons = [];
            fetch('./whale_hoshino_data/item.json').then(function (r) { return r.json(); }).then(function (data) {
                icons = data.icons || [];
                renderIcons(icons);
                if (searchInput) searchInput.addEventListener('input', applyFilters);
                Array.prototype.forEach.call(categoryButtons, function (button) {
                    button.addEventListener('click', function () {
                        Array.prototype.forEach.call(categoryButtons, function (b) { b.classList.remove('active'); });
                        button.classList.add('active');
                        activeCategory = button.dataset.category || 'all';
                        applyFilters();
                    });
                });
            }).catch(function (err) {
                console.error('加载物品数据失败:', err);
            });
        });
    </script>
